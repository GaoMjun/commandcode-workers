# Worker name on Cloudflare (already deployed as commandcode-proxy)
name = "commandcode-proxy"
main = "src/index.js"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

[vars]
CC_API_BASE = "https://api.commandcode.ai"
PROJECT_SLUG = "cc-proxy"
CC_USE_PROVIDER_MODELS = "true"

[observability.logs]
enabled = true
invocation_logs = true

# Optional fallback API key (prefer per-request Authorization header):
# npx wrangler secret put CC_API_KEY
